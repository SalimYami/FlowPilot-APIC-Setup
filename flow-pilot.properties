# =============================================================================
# flow-pilot.properties — IBM API Connect Flow Pilot Configuration
# =============================================================================
# Instructions:
#   1. Fill in the values relevant to your deployment.
#   2. Leave fields blank if you prefer interactive prompts.
#   3. NEVER commit this file with real credentials to a public repository.
#      Add it to .gitignore once you fill in secrets.
# =============================================================================

# ── 1. DEPLOYMENT MODE ──────────────────────────────────────────────────────
# auto      : script auto-detects based on filled fields and oc login session
# openshift : force OpenShift / TechZone / on-premises mode
# saas      : force SaaS cloud mode
DEPLOYMENT_MODE=auto

# ── 2. OPENSHIFT / TECHZONE / ON-PREMISES ───────────────────────────────────
# Provide either the oc login details (auto-connect) OR the resolved HTTPS URLs.

# oc login --token=<token> --server=<url>  (used for automatic oc login)
OPENSHIFT_API_URL=
OPENSHIFT_TOKEN=

# Kubernetes namespace where APIC is deployed
OPENSHIFT_NAMESPACE=apic

# Direct HTTPS URLs (overrides auto-discovery if set)
OPENSHIFT_MGMT_URL=
OPENSHIFT_PLATFORM_URL=

# ── 3. SAAS CLOUD ───────────────────────────────────────────────────────────
# Set SAAS_REGION to a known region code, OR set the two URLs directly.
# Known regions: us-east-1 | eu-central-1 | eu-west-2 | ap-south-1 | ap-southeast-2
SAAS_REGION=
SAAS_MGMT_URL=
SAAS_PLATFORM_URL=

# ── 4. IBM API CONNECT CREDENTIALS ──────────────────────────────────────────
# Provider organization name (visible top-left in the API Manager UI)
PROVIDER_ORG=

# Toolkit credentials: API Manager Home > Download Tools > Toolkit > Toolkit credentials
CLIENT_ID=
CLIENT_SECRET=

# API Key: Profile icon > My API Keys > Add > Enable multiple use
API_KEY=

# ── 5. TLS ───────────────────────────────────────────────────────────────────
# 0 = accept self-signed certificates  (recommended for TechZone / on-prem / POC)
# 1 = enforce strict TLS chain         (recommended for SaaS / production)
# Leave blank for automatic detection (0 on OpenShift/TechZone, 1 on SaaS).
NODE_TLS_REJECT_UNAUTHORIZED=
